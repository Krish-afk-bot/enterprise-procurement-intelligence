name: Dependency Review

on:
  pull_request:
    branches: [master, main]

# Dependency Review checks PRs for newly introduced vulnerable or
# license-incompatible dependencies before they are merged.
# https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Fail on high or critical severity vulnerabilities
          fail-on-severity: high
          # Allow licenses commonly used in open-source projects
          allow-licenses: >-
            MIT,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            Python-2.0,
            PSF-2.0,
            LGPL-2.1,
            LGPL-3.0,
            MPL-2.0
