name: PR Gate

# Runs on every pull request targeting master or main.
# Purpose: fast feedback on lint, type, and test correctness before merge.
# Depends on: RQ-2 (requirements.txt lockfile), TEST-1 (unit tests).

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ backend: lint + typecheck
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Install package (editable)
        run: pip install -e ".[eval]" ruff mypy

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy app/

  # ------------------------------------------------------------------ backend: unit tests
  backend-tests:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Install package (editable)
        run: pip install -e ".[eval]"

      - name: Run unit tests
        run: pytest tests/unit/ -q

  # ------------------------------------------------------------------ frontend: lint + typecheck
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
