name: Nightly evaluation

# Full v2 run against a real local model. This is intentionally heavier than the
# PR gate: it installs Ollama, pulls llama3.1:8b, and evaluates all 130 questions
# in both current and oracle modes. Results are uploaded as an artifact.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: eval-nightly
  cancel-in-progress: false

jobs:
  full-eval:
    name: Full v2 evaluation (llama3.1:8b)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e ./backend

      - name: Pull the evaluation model
        run: |
          curl -fsS http://localhost:11434/api/pull \
            -H "Content-Type: application/json" \
            -d '{"name":"llama3.1:8b","stream":false}'

      - name: Ingest the corpus into an isolated database
        working-directory: backend
        env:
          EVAL_VAR_DIR: ${{ github.workspace }}/backend/var/eval-v2
          DATABASE_URL: sqlite+aiosqlite:///${{ github.workspace }}/backend/var/eval-v2/eval.db
          VAR_DIR: ${{ github.workspace }}/backend/var/eval-v2/var
          LOCAL_STORAGE_DIR: ${{ github.workspace }}/backend/var/eval-v2/storage
          OCR_ENABLED: "false"
          VLM_ENABLED: "false"
          EMBEDDING_PROVIDER: sentence_transformers
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          RERANKER_ENABLED: "true"
          RERANKER_PROVIDER: cross_encoder
          ALLOW_PROVIDER_FALLBACK: "false"
        run: |
          mkdir -p "$EVAL_VAR_DIR/var" "$EVAL_VAR_DIR/storage"
          python -m app.cli ingest ../data/synthetic --no-ocr --no-vision

      - name: Run both evaluation modes
        working-directory: backend
        env:
          EVAL_VAR_DIR: ${{ github.workspace }}/backend/var/eval-v2
          DATABASE_URL: sqlite+aiosqlite:///${{ github.workspace }}/backend/var/eval-v2/eval.db
          VAR_DIR: ${{ github.workspace }}/backend/var/eval-v2/var
          LOCAL_STORAGE_DIR: ${{ github.workspace }}/backend/var/eval-v2/storage
          OCR_ENABLED: "false"
          VLM_ENABLED: "false"
          EMBEDDING_PROVIDER: sentence_transformers
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          RERANKER_ENABLED: "true"
          RERANKER_PROVIDER: cross_encoder
          ALLOW_PROVIDER_FALLBACK: "false"
          LLM_PROVIDER: openai_compatible
          LLM_BASE_URL: http://localhost:11434/v1
          LLM_API_KEY: ollama
          LLM_MODEL: llama3.1:8b
        run: |
          python scripts_phase3/eval_v2.py --mode both --label nightly --write-taxonomy

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-nightly
          path: |
            data/evaluation/v2/nightly_*.json
            docs/results/failure-taxonomy.md
          if-no-files-found: warn
