name: Frontend

on:
  pull_request:
    branches: [master, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [master, main]
    paths:
      - "frontend/**"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    defaults:
      run:
        working-directory: frontend
    # NOTE: No frontend tests exist yet. See COMMITS.md TEST-4.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if [ -f "vitest.config.ts" ] || [ -f "vitest.config.js" ]; then
            npx vitest run
          else
            echo "Vitest not configured yet — skipping. See COMMITS.md TEST-4."
          fi
