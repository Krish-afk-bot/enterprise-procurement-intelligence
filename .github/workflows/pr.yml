name: PR Gate

# Runs on every pull request targeting master or main.
# Provides fast feedback: lint, format, type-check, unit tests, frontend build.
# Does NOT require an LLM API key or any live external services.

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ backend: lint + format
  backend-lint:
    name: Backend — Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Install package + tools
        run: pip install -e ".[eval]" ruff mypy types-python-dateutil

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: mypy (app/ — warnings allowed, no gate breakage on timeout)
        run: |
          timeout 300 python -m mypy app/ --ignore-missing-imports --no-error-summary \
            || echo "::warning::mypy reported issues — see output"

  # ------------------------------------------------------------------ backend: unit tests
  backend-tests:
    name: Backend — Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Install package
        run: pip install -e ".[eval]"

      - name: Run tests
        run: pytest tests/ -q

  # ------------------------------------------------------------------ frontend
  frontend:
    name: Frontend — Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest unit tests
        run: npm run test

      - name: Production build
        run: npm run build
