[project]
name = "epi-backend"
version = "0.1.0"
description = "Enterprise Procurement Intelligence - multimodal, agentic, graph-enhanced RAG backend"
requires-python = ">=3.11"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    # data
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "qdrant-client>=1.10",
    "neo4j>=5.24",
    "boto3>=1.34",
    # ai orchestration
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "httpx>=0.27",
    # parsing
    "pymupdf>=1.24",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    # retrieval helpers
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    # embeddings / reranking (optional heavyweight extras live behind provider flags)
    "sentence-transformers>=3.0",
    # observability / security
    "structlog>=24.1",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "opencv-python-headless>=4.9", "pillow>=10.0"]
vision = ["transformers>=4.44", "torch>=2.2"]
eval = ["pytest>=8.0", "pytest-asyncio>=0.23"]
observability = ["langsmith>=0.1", "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]

[project.scripts]
epi = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
