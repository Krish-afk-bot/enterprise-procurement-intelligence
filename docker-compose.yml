# Development stack for Enterprise Procurement Intelligence.
#
#   docker compose up -d postgres qdrant neo4j redis minio
#   docker compose --profile app up -d            # also run api + web
#
# The API runs on local providers by default so it works without any of these
# services. Point it at this stack by copying `.env.example` to `.env` and
# setting VECTOR_PROVIDER=qdrant, GRAPH_PROVIDER=neo4j, CACHE_PROVIDER=redis,
# STORAGE_PROVIDER=s3 and DATABASE_URL=postgresql+asyncpg://... (asyncpg is the
# database driver declared in backend/pyproject.toml; psycopg is not installed).
#
# Credentials here are development-only and intentionally trivial.

name: epi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: epi
      POSTGRES_PASSWORD: epi
      POSTGRES_DB: epi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epi -d epi"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    # Pinned to v1.16.1 to match the qdrant-client==1.17.0 Python library.
    # Qdrant's compatibility policy: client N is compatible with server N-1
    # but not N-2. Upgrading server from 1.9.7 to 1.16.1 requires sequential
    # minor upgrades — acceptable for a fresh (empty) dev volume.
    image: qdrant/qdrant:v1.16.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.22-community
    environment:
      # neo4j 5.x rejects "neo4j" as the password (the old default).
      # Using "neo4jdev" for the development stack.
      NEO4J_AUTH: neo4j/neo4jdev
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # minio/minio and minio/mc were deleted from Docker Hub on 2026-09-11.
    # ifirestone/minio mirrors cgr.dev/chainguard/minio (built from source,
    # AGPL-licensed). It ships both the minio server binary and mc in a single
    # image, so the same tag is reused for minio-init below.
    image: ifirestone/minio:RELEASE.2026-09-22T19-25-18Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # mc is on PATH in the ifirestone/minio image.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    # Same image as the server — it contains mc. Override entrypoint to /bin/sh
    # because the default entrypoint is /usr/bin/minio (the server binary).
    image: ifirestone/minio:RELEASE.2026-09-22T19-25-18Z
    entrypoint: ["/bin/sh"]
    depends_on:
      minio:
        condition: service_healthy
    command:
      - "-c"
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/epi-documents &&
        echo 'bucket epi-documents ready'

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://epi:epi@postgres:5432/epi
      AUTO_CREATE_SCHEMA: "false"
      VECTOR_PROVIDER: qdrant
      QDRANT_URL: http://qdrant:6333
      GRAPH_PROVIDER: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: neo4jdev
      CACHE_PROVIDER: redis
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: epi-documents
      ALLOW_PROVIDER_FALLBACK: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/var:/app/backend/var
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  redis_data:
  minio_data:
