name: Backend Tests

on:
  pull_request:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [master, main]
    paths:
      - "backend/**"

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # NOTE: No tests exist yet. This workflow will become active once
    # backend/tests/unit/ is populated (see COMMITS.md TEST-1).

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[eval]"

      - name: Run unit tests
        run: |
          if [ -d "tests/unit" ] && [ "$(find tests/unit -name 'test_*.py' | wc -l)" -gt 0 ]; then
            pytest tests/unit/ -q --tb=short
          else
            echo "No unit tests found yet — skipping. See COMMITS.md TEST-1."
          fi

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: backend
    # NOTE: No integration tests exist yet. See COMMITS.md TEST-2.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[eval]"

      - name: Run integration tests
        run: |
          if [ -d "tests/integration" ] && [ "$(find tests/integration -name 'test_*.py' | wc -l)" -gt 0 ]; then
            pytest tests/integration/ -q --tb=short
          else
            echo "No integration tests found yet — skipping. See COMMITS.md TEST-2."
          fi

  retrieval:
    name: Retrieval Tests
    runs-on: ubuntu-latest
    needs: integration
    defaults:
      run:
        working-directory: backend
    # NOTE: No retrieval tests exist yet. See COMMITS.md TEST-3.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[eval]"

      - name: Run retrieval tests
        run: |
          if [ -d "tests/retrieval" ] && [ "$(find tests/retrieval -name 'test_*.py' | wc -l)" -gt 0 ]; then
            pytest tests/retrieval/ -q --tb=short
          else
            echo "No retrieval tests found yet — skipping. See COMMITS.md TEST-3."
          fi
