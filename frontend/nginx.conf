server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (/dashboard, /documents/:id, ...) all resolve to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API calls from the browser are forwarded to the API service,
    # so the bundle needs no absolute backend URL and no CORS exception.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (streaming answers) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
